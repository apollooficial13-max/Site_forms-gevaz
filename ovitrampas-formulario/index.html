<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Formulário de visita às Ovitrampas</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --fundo: #eef2f4; --papel: #ffffff; --tinta: #1d2733; --suave: #5d6b78;
    --linha: #d3dbe1; --acento: #0f766e; --acento-esc: #0b5a54; --perigo: #b42318;
    --hover: #e3f1ef; --hover-perigo: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fundo: #11171c; --papel: #1a222a; --tinta: #e6ecf0; --suave: #9aa9b5;
      --linha: #2c3843; --acento: #2dd4bf; --acento-esc: #5eead4; --perigo: #f97066;
      --hover: #17302d; --hover-perigo: #3a1a17;
    }
  }
  :root[data-theme="dark"] {
    --fundo: #11171c; --papel: #1a222a; --tinta: #e6ecf0; --suave: #9aa9b5;
    --linha: #2c3843; --acento: #2dd4bf; --acento-esc: #5eead4; --perigo: #f97066;
    --hover: #17302d; --hover-perigo: #3a1a17;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--tinta);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 28px 16px 56px; display: grid; gap: 20px; }
  h1 { font-size: 1.6rem; margin: 0; }
  header p { margin: 4px 0 0; color: var(--suave); font-size: .95rem; }
  section { background: var(--papel); border: 1px solid var(--linha); border-radius: 10px; padding: 20px; }
  h2 { font-size: 1.1rem; margin: 0 0 16px; }
  form { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .campo { display: grid; gap: 4px; }
  .campo.largo { grid-column: 1 / -1; }
  label { font-weight: 600; font-size: .9rem; }
  input, textarea, select { font: inherit; padding: 9px 10px; border: 1px solid var(--linha);
    border-radius: 6px; background: var(--fundo); color: inherit; width: 100%; }
  textarea { min-height: 84px; resize: vertical; }
  .opcoes { display: flex; flex-wrap: wrap; gap: 8px 22px; padding-top: 4px; }
  .opcoes label { font-weight: 400; display: flex; align-items: center; gap: 6px; font-size: 1rem; }
  .opcoes input { width: auto; padding: 0; accent-color: var(--acento); }
  .ano-wrap { position: relative; }
  .ano-wrap input { cursor: pointer; }
  .ano-painel { position: absolute; z-index: 10; top: 100%; left: 0; margin-top: 4px; width: min(280px, 90vw);
    background: var(--papel); border: 1px solid var(--linha); border-radius: 10px; padding: 10px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .2); }
  .ano-topo { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .ano-topo button:disabled { opacity: .35; cursor: default; }
  .ano-grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  button.ano-btn { color: var(--tinta); border-color: transparent; padding: 9px 0; }
  button.ano-btn.hoje { border-color: var(--acento); }
  button.ano-btn.sel, button.ano-btn.sel:hover { background: var(--acento); color: var(--papel); }
  button.ano-btn:disabled { opacity: .3; cursor: default; }
  :focus-visible { outline: 3px solid var(--acento); outline-offset: 1px; }
  .acoes { grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; }
  button { font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--acento); background: var(--acento); color: #fff; }
  button:hover { background: var(--acento-esc); }
  :root[data-theme="dark"] button:not(.sec):not(.perigo) { color: #06201d; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button:not(.sec):not(.perigo) { color: #06201d; } }
  button.sec { background: transparent; color: var(--acento); }
  button.sec:hover { background: var(--hover); }
  button.perigo { background: transparent; color: var(--perigo); border-color: var(--perigo); }
  button.perigo:hover { background: var(--hover-perigo); }
  button.mini { padding: 4px 10px; font-size: .85rem; }
  #aviso { min-height: 1.4em; margin: 12px 0 0; font-size: .95rem; }
  #aviso.erro { color: var(--perigo); }
  #aviso.ok { color: var(--acento); }
  .tabela { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .93rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--linha); vertical-align: top; }
  th { color: var(--suave); font-weight: 600; white-space: nowrap; }
  .botoes { display: flex; gap: 6px; }
  .vazio { color: var(--suave); margin: 0; }
  header p.ok { color: var(--acento); }
  header p.erro { color: var(--perigo); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Formulário de visita às Ovitrampas</h1>
    <p id="modo"></p>
  </header>

  <section>
    <h2 id="titulo-form">Novo registro</h2>
    <form id="form" novalidate></form>
    <p id="aviso" role="status"></p>
  </section>

  <section>
    <h2>Registros salvos</h2>
    <div class="tabela"><table id="tabela"></table></div>
    <p id="vazio" class="vazio" hidden>Nenhum registro ainda. Preencha o formulário e clique em Salvar.</p>
  </section>
</main>

<script>
// ---- CONFIGURAÇÃO -------------------------------------------------
// Os campos do formulário ficam no app.py (lista CAMPOS) e chegam aqui pelo servidor.
let CAMPOS = [];
const nomeCurto = c => c.curto || c.rotulo;
// Endereço do servidor Flask (app.py).
// Deixe "" para detectar sozinho: aberto pelo servidor (http://localhost:5000) usa o mesmo endereço;
// aberto como arquivo (file://), usa http://localhost:5000.
const SERVIDOR = "";
const BASE = SERVIDOR || (location.protocol === "file:" ? "http://localhost:5000" : "");
const API_URL = BASE + "/api/registros";
// -------------------------------------------------------------------

async function http(url, metodo, corpo) {
  let r;
  try {
    r = await fetch(url, {
      method: metodo,
      headers: { "Content-Type": "application/json" },
      body: corpo ? JSON.stringify(corpo) : undefined,
    });
  } catch (e) {
    throw new Error("Não foi possível conectar ao servidor. Inicie com 'python app.py' e acesse http://localhost:5000.");
  }
  const resposta = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(resposta.erro || "Não foi possível falar com a API.");
  return resposta;
}

const dados = {
  listar: () => http(API_URL, "GET"),
  criar: doc => http(API_URL, "POST", doc),
  atualizar: (id, doc) => http(API_URL + "/" + id, "PUT", doc),
  excluir: id => http(API_URL + "/" + id, "DELETE"),
};

const form = document.getElementById("form");
const aviso = document.getElementById("aviso");
const tabela = document.getElementById("tabela");
const vazio = document.getElementById("vazio");
const titulo = document.getElementById("titulo-form");
let editandoId = null;
let registros = [];

async function verificarServidor() {
  const modo = document.getElementById("modo");
  try {
    const st = await http(BASE + "/api/status", "GET");
    modo.textContent = "Conectado ao MongoDB: " + st.banco + " / " + st.colecao;
    modo.className = "ok";
  } catch (e) {
    modo.textContent = e.message;
    modo.className = "erro";
  }
}

function mensagem(texto, tipo) { aviso.textContent = texto; aviso.className = tipo || ""; }

const anoHoje = new Date().getFullYear();

// Seletor só de anos, no estilo da visão de anos de um calendário.
function criarSeletorAno(c) {
  const min = c.minimo || 2000;
  const max = c.maximo || anoHoje + 1;
  const wrap = document.createElement("div");
  wrap.className = "ano-wrap";
  const input = document.createElement("input");
  input.type = "text"; input.readOnly = true; input.autocomplete = "off";
  input.id = "f_" + c.nome; input.name = c.nome;
  input.placeholder = "Selecione o ano";
  input.setAttribute("aria-haspopup", "dialog");
  input.setAttribute("aria-expanded", "false");
  const painel = document.createElement("div");
  painel.className = "ano-painel"; painel.hidden = true;
  painel.setAttribute("role", "dialog"); painel.setAttribute("aria-label", "Escolher ano");
  const topo = document.createElement("div");
  topo.className = "ano-topo";
  const ant = document.createElement("button");
  ant.type = "button"; ant.className = "sec mini"; ant.textContent = "‹";
  ant.setAttribute("aria-label", "Anos anteriores");
  const prox = document.createElement("button");
  prox.type = "button"; prox.className = "sec mini"; prox.textContent = "›";
  prox.setAttribute("aria-label", "Próximos anos");
  const tit = document.createElement("strong");
  topo.append(ant, tit, prox);
  const grade = document.createElement("div");
  grade.className = "ano-grade";
  painel.append(topo, grade);
  wrap.append(input, painel);

  let inicio = 0;
  const escolhido = () => parseInt(input.value, 10) || null;
  const fechar = () => { painel.hidden = true; input.setAttribute("aria-expanded", "false"); };

  function desenhar() {
    tit.textContent = inicio + " – " + (inicio + 11);
    ant.disabled = inicio <= min;
    prox.disabled = inicio + 11 >= max;
    grade.replaceChildren();
    for (let a = inicio; a < inicio + 12; a++) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "sec ano-btn" + (a === escolhido() ? " sel" : "") + (a === anoHoje ? " hoje" : "");
      b.textContent = a;
      b.disabled = a < min || a > max;
      b.setAttribute("aria-pressed", a === escolhido() ? "true" : "false");
      b.onclick = () => { input.value = a; fechar(); input.focus(); };
      grade.append(b);
    }
  }
  function abrir() {
    const base = escolhido() || anoHoje;
    inicio = Math.max(min, Math.min(base - 10, max - 11));
    desenhar();
    painel.hidden = false;
    input.setAttribute("aria-expanded", "true");
    (grade.querySelector(".sel") || grade.querySelector(".hoje")
      || grade.querySelector("button:not(:disabled)"))?.focus();
  }
  ant.onclick = () => { inicio -= 12; desenhar(); };
  prox.onclick = () => { inicio += 12; desenhar(); };
  input.addEventListener("click", () => (painel.hidden ? abrir() : fechar()));
  input.addEventListener("keydown", ev => {
    if (["Enter", " ", "ArrowDown"].includes(ev.key)) { ev.preventDefault(); abrir(); }
  });
  wrap.addEventListener("keydown", ev => {
    if (ev.key === "Escape" && !painel.hidden) { fechar(); input.focus(); }
  });
  document.addEventListener("click", ev => { if (!wrap.contains(ev.target)) fechar(); });
  return wrap;
}

function montarForm() {
  CAMPOS.forEach(c => {
    const div = document.createElement("div");
    div.className = "campo" + (["textarea", "radio"].includes(c.tipo) ? " largo" : "");
    const lab = document.createElement("label");
    lab.textContent = c.rotulo + (c.obrigatorio ? " *" : "");
    if (c.tipo === "ano") {
      lab.htmlFor = "f_" + c.nome;
      div.append(lab, criarSeletorAno(c));
    } else if (c.tipo === "radio") {
      lab.id = "l_" + c.nome;
      const grupo = document.createElement("div");
      grupo.className = "opcoes";
      grupo.setAttribute("role", "radiogroup");
      grupo.setAttribute("aria-labelledby", lab.id);
      c.opcoes.forEach(o => {
        const l = document.createElement("label");
        const r = document.createElement("input");
        r.type = "radio"; r.name = c.nome; r.value = o;
        l.append(r, o);
        grupo.append(l);
      });
      div.append(lab, grupo);
    } else {
      lab.htmlFor = "f_" + c.nome;
      let el;
      if (c.tipo === "select") {
        el = document.createElement("select");
        el.append(new Option("Selecione...", ""), ...(c.opcoes || []).map(o => new Option(o, o)));
      } else {
        el = document.createElement(c.tipo === "textarea" ? "textarea" : "input");
        if (c.tipo !== "textarea") el.type = c.tipo;
        if (c.tipo === "number") el.step = c.passo || "any";
      }
      el.id = "f_" + c.nome;
      el.name = c.nome;
      div.append(lab, el);
    }
    form.append(div);
  });
  const acoes = document.createElement("div");
  acoes.className = "acoes";
  const salvar = document.createElement("button");
  salvar.type = "submit"; salvar.id = "btn-salvar"; salvar.textContent = "Salvar";
  const limpar = document.createElement("button");
  limpar.type = "button"; limpar.className = "sec"; limpar.id = "btn-limpar";
  limpar.textContent = "Limpar"; limpar.onclick = resetar;
  acoes.append(salvar, limpar);
  form.append(acoes);
  // Listas que dependem de outro campo (Bairro depende do DS)
  CAMPOS.filter(c => c.depende_de).forEach(c => {
    const pai = form.elements[c.depende_de];
    const filho = form.elements[c.nome];
    const nomePai = nomeCurto(CAMPOS.find(x => x.nome === c.depende_de));
    c._atualizar = valor => {
      const lista = c.opcoes_por[pai.value] || [];
      filho.replaceChildren(
        new Option(lista.length ? "Selecione..." : "Escolha o " + nomePai + " primeiro", ""),
        ...lista.map(o => new Option(o, o)));
      filho.disabled = !lista.length;
      if (valor) filho.value = valor;
    };
    pai.addEventListener("change", () => c._atualizar());
    c._atualizar();
  });
}

function limparForm() {
  form.reset();
  CAMPOS.forEach(c => c._atualizar && c._atualizar());
}

function resetar() {
  limparForm();
  editandoId = null;
  titulo.textContent = "Novo registro";
  document.getElementById("btn-salvar").textContent = "Salvar";
  document.getElementById("btn-limpar").textContent = "Limpar";
}

function validar() {
  const doc = {};
  for (const c of CAMPOS) {
    const v = form.elements[c.nome].value.trim();
    if (c.obrigatorio && !v) throw new Error("O campo '" + nomeCurto(c) + "' é obrigatório.");
    if (!v) { doc[c.nome] = null; continue; }
    if (c.tipo === "number" || c.tipo === "ano") {
      const n = Number(v.replace(",", "."));
      if (Number.isNaN(n)) throw new Error("O campo '" + nomeCurto(c) + "' precisa ser um número.");
      doc[c.nome] = n;
    } else doc[c.nome] = v;
  }
  return doc;
}

async function carregar() {
  try { registros = await dados.listar(); desenhar(); }
  catch (e) { mensagem(e.message, "erro"); }
}

function desenhar() {
  tabela.replaceChildren();
  vazio.hidden = registros.length > 0;
  if (!registros.length) return;
  const cab = tabela.createTHead().insertRow();
  [...CAMPOS.map(nomeCurto), ""].forEach(t => {
    const th = document.createElement("th"); th.textContent = t; cab.append(th);
  });
  const corpo = tabela.createTBody();
  registros.forEach(reg => {
    const tr = corpo.insertRow();
    CAMPOS.forEach(c => { tr.insertCell().textContent = reg[c.nome] ?? ""; });
    const div = document.createElement("div");
    div.className = "botoes";
    const ed = document.createElement("button");
    ed.className = "sec mini"; ed.textContent = "Editar"; ed.onclick = () => editar(reg);
    const ex = document.createElement("button");
    ex.className = "perigo mini"; ex.textContent = "Excluir"; ex.onclick = () => excluir(reg);
    div.append(ed, ex);
    tr.insertCell().append(div);
  });
}

function editar(reg) {
  limparForm();
  editandoId = reg._id;
  CAMPOS.forEach(c => {
    if (c._atualizar) c._atualizar(reg[c.nome]);
    else form.elements[c.nome].value = reg[c.nome] ?? "";
  });
  titulo.textContent = "Editando registro";
  document.getElementById("btn-salvar").textContent = "Salvar alterações";
  document.getElementById("btn-limpar").textContent = "Cancelar edição";
  mensagem("");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function excluir(reg) {
  if (!confirm("Excluir este registro?")) return;
  try {
    await dados.excluir(reg._id);
    if (editandoId === reg._id) resetar();
    mensagem("Registro excluído.", "ok");
    carregar();
  } catch (e) { mensagem(e.message, "erro"); }
}

form.addEventListener("submit", async ev => {
  ev.preventDefault();
  try {
    const doc = validar();
    const novo = editandoId === null;
    if (novo) await dados.criar(doc); else await dados.atualizar(editandoId, doc);
    mensagem(novo ? "Registro salvo." : "Alterações salvas.", "ok");
    resetar();
    carregar();
  } catch (e) { mensagem(e.message, "erro"); }
});

async function iniciar() {
  verificarServidor();
  try {
    CAMPOS = await http(BASE + "/api/campos", "GET");
    montarForm();
    carregar();
  } catch (e) { mensagem(e.message, "erro"); }
}
iniciar();
</script>
</body>
</html>
